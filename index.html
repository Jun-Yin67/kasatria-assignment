<!DOCTYPE html>
<html>

<head>
	<title>three.js css3d - periodic table</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<meta property="og:title" content="three.js css3d - periodic table">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://threejs.org/examples/css3d_periodictable.html">
	<meta property="og:image" content="https://threejs.org/examples/screenshots/css3d_periodictable.jpg">
	<link type="text/css" rel="stylesheet" href="main.css">

	<script>
		window.handleCredentialResponse = function (response) {

			document.getElementById('login-screen').style.display = 'none';
			document.getElementById('container').style.display = 'block';
			document.getElementById('menu').style.display = 'grid';
			document.getElementById('info').style.display = 'block';

			window.dispatchEvent(new CustomEvent('kasatria-login-success'));

		};
	</script>
	<script src="https://accounts.google.com/gsi/client?hl=en" async defer></script>

	<style>
		a {
			color: #8ff;
		}

		#login-screen {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: #000;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}

		#login-box {
			background: #111;
			border: 1px solid rgba(127, 255, 255, 0.4);
			border-radius: 10px;
			padding: 40px;
			text-align: center;
			color: #fff;
			font-family: Helvetica, sans-serif;
		}

		#login-box h2 {
			margin-top: 0;
		}

		#container,
		#menu,
		#info {
			display: none;
		}

		#menu {
			position: absolute;
			bottom: 20px;
			width: 100%;
			display: grid;
			grid-template-columns: 1fr auto 1fr;
			align-items: center;
			gap: 95px;
		}

		.button-group {
			grid-column: 2;
			display: flex;
			gap: 20px;
			justify-self: center;
		}

		#legend {
			grid-column: 3;
			justify-self: start;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.legend-bar {
			width: 200px;
			height: 14px;
			border-radius: 3px;
			background: linear-gradient(to right, #EF3022, #FDCA35, #3A9F48);
		}

		.legend-label {
			font-family: Helvetica, sans-serif;
			font-size: 12px;
			color: rgba(255, 255, 255, 0.85);
		}

		.element {
			width: 120px;
			height: 160px;
			box-shadow: 0px 0px 12px rgba(0, 255, 255, 0.5);
			border: 1px solid rgba(127, 255, 255, 0.25);
			font-family: Helvetica, sans-serif;
			text-align: center;
			line-height: normal;
			cursor: default;
		}

		.element:hover {
			box-shadow: 0px 0px 12px rgba(0, 255, 255, 0.75);
			border: 1px solid rgba(127, 255, 255, 0.75);
		}

		.element .number {
			position: absolute;
			top: 20px;
			right: 20px;
			font-size: 12px;
			color: rgba(127, 255, 255, 0.75);
		}

		.element .symbol {
			position: absolute;
			top: 40px;
			left: 0px;
			right: 0px;
			font-size: 60px;
			font-weight: bold;
			color: rgba(255, 255, 255, 0.75);
			text-shadow: 0 0 10px rgba(0, 255, 255, 0.95);
		}

		.element .details {
			position: absolute;
			bottom: 15px;
			left: 0px;
			right: 0px;
			font-size: 12px;
			color: rgba(127, 255, 255, 0.75);
		}

		button {
			color: rgba(127, 255, 255, 0.75);
			background: transparent;
			outline: 1px solid rgba(127, 255, 255, 0.75);
			border: 0px;
			padding: 5px 10px;
			cursor: pointer;
		}

		button:hover {
			background-color: rgba(0, 255, 255, 0.5);
		}

		button:active {
			color: #000000;
			background-color: rgba(0, 255, 255, 0.75);
		}
	</style>
</head>

<body>

	<div id="login-screen">
		<div id="login-box">
			<h2>Welcome</h2>
			<p>Please sign in to continue</p>
			<div id="g_id_onload"
				data-client_id="155359375894-k2ema6l9jvlu352vabkkqioeebka99fn.apps.googleusercontent.com"
				data-callback="handleCredentialResponse" data-auto_prompt="false">

			</div>
			<div class="g_id_signin" data-type="standard"></div>
		</div>
	</div>

	<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> css3d - periodic table.
	</div>
	<div id="container"></div>
	<div id="menu">
		<div class="button-group">
			<button id="table">TABLE</button>
			<button id="sphere">SPHERE</button>
			<button id="helix">HELIX</button>
			<button id="grid">GRID</button>
			<button id="tetrahedron">TETRAHEDRON</button>
		</div>
		<div id="legend">
			<span class="legend-label">LOW</span>
			<div class="legend-bar"></div>
			<span class="legend-label">High</span>
		</div>
	</div>
	<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.180.0/build/three.module.js",
        			"three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
				}
			}
		</script>

	<script type="module">

		import * as THREE from 'three';

		import TWEEN from 'three/addons/libs/tween.module.js';
		import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
		import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

		window.addEventListener('kasatria-login-success', () => {

			loadData();

		});

		let camera, scene, renderer;
		let controls;

		const objects = [];
		const targets = { table: [], sphere: [], helix: [], grid: [], tetrahedron: [] };

		let peopleData = [];

		async function loadData() {

			const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vSZQOD1RYHoyxEXxt9_UF1LNdtTcYSWq92TmHjc0TJQbsJdXerkeUnrU8lfYFeRTV0i-j1m7D3H49P0/pub?output=csv');
			const csvText = await response.text();

			const rows = csvText.trim().split('\n').slice(1);

			peopleData = rows.map((row) => {

				const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g).map(c => c.replace(/^"|"$/g, ''));

				const [name, photo, age, country, interest, netWorthStr] = cols;
				const netWorth = parseFloat(netWorthStr.replace(/[$,]/g, ''));

				return { name, photo, age, country, interest, netWorth };

			});

			init();
			animate();

		}

		function init() {

			camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
			camera.position.z = 3000;

			scene = new THREE.Scene();

			// table

			const columns = 20;

			for (let i = 0; i < peopleData.length; i++) {

				const person = peopleData[i];

				const tileColor = getTileColor(person.netWorth);

				const element = document.createElement('div');
				element.className = 'element';
				element.style.backgroundColor = '#000000';
				element.style.border = '2px solid ' + tileColor;
				element.style.boxShadow = '0 0 15px ' + tileColor;
				element.style.display = 'flex';
				element.style.flexDirection = 'column';
				element.style.justifyContent = 'space-between';
				element.style.padding = '6px';
				element.style.boxSizing = 'border-box';

				// top row: country (left) + age (right)
				const topRow = document.createElement('div');
				topRow.style.display = 'flex';
				topRow.style.justifyContent = 'space-between';
				topRow.style.width = '100%';
				topRow.style.fontSize = '11px';
				topRow.style.fontWeight = 'bold';

				const country = document.createElement('div');
				country.textContent = person.country;
				topRow.appendChild(country);

				const age = document.createElement('div');
				age.textContent = person.age;
				topRow.appendChild(age);

				element.appendChild(topRow);

				// photo, centered
				const photo = document.createElement('img');
				photo.src = person.photo;
				photo.style.width = '100px';
				photo.style.height = '100px';
				photo.style.objectFit = 'cover';
				photo.style.borderRadius = '4px';
				photo.style.display = 'block';
				photo.style.margin = '0 auto 8px auto';
				element.appendChild(photo);

				// name, centered, below photo
				const name = document.createElement('div');
				name.textContent = person.name;
				name.style.textAlign = 'center';
				name.style.fontSize = '14px';
				name.style.fontWeight = 'bold';
				element.appendChild(name);

				// interest, bottom
				const interest = document.createElement('div');
				interest.textContent = person.interest;
				interest.style.textAlign = 'center';
				interest.style.fontSize = '8px';
				element.appendChild(interest);

				const objectCSS = new CSS3DObject(element);
				objectCSS.position.x = Math.random() * 4000 - 2000;
				objectCSS.position.y = Math.random() * 4000 - 2000;
				objectCSS.position.z = Math.random() * 4000 - 2000;
				scene.add(objectCSS);

				objects.push(objectCSS);

				//

				const object = new THREE.Object3D();
				object.position.x = ((i % columns) * 140) - 1330;
				object.position.y = - (Math.floor(i / columns) * 180) + 810;

				targets.table.push(object);

			}

			function getTileColor(netWorth) {

				if (netWorth < 100000) return '#EF3022';
				if (netWorth > 200000) return '#3A9F48';
				return '#FDDA35';

			}

			// sphere

			const vector = new THREE.Vector3();

			for (let i = 0, l = objects.length; i < l; i++) {

				const phi = Math.acos(- 1 + (2 * i) / l);
				const theta = Math.sqrt(l * Math.PI) * phi;

				const object = new THREE.Object3D();

				object.position.setFromSphericalCoords(800, phi, theta);

				vector.copy(object.position).multiplyScalar(2);

				object.lookAt(vector);

				targets.sphere.push(object);

			}

			// helix

			for (let i = 0, l = objects.length; i < l; i++) {

				const strand = i % 2;               // 0 = strand A, 1 = strand B
				const posInStrand = Math.floor(i / 2); // this tile's position along its strand

				const theta = posInStrand * 0.35 + Math.PI + (strand * Math.PI); // strand B offset by 180°
				const y = - (posInStrand * 16) + 450;

				const object = new THREE.Object3D();

				object.position.setFromCylindricalCoords(900, theta, y);

				vector.x = object.position.x * 2;
				vector.y = object.position.y;
				vector.z = object.position.z * 2;

				object.lookAt(vector);

				targets.helix.push(object);

			}

			// grid (for 5 x 4 x 10 layout)

			for (let i = 0; i < objects.length; i++) {

				const object = new THREE.Object3D();

				object.position.x = ((i % 5) * 400) - 800;
				object.position.y = (- (Math.floor(i / 5) % 4) * 400) + 600;
				object.position.z = (Math.floor(i / 20)) * 1000 - 4500;

				targets.grid.push(object);

			}

			// tetrahedron (4 triangular faces, ~50 tiles per face)	
			const tetraSize = 1000;
			const tA = new THREE.Vector3(1, 1, 1).multiplyScalar(tetraSize);
			const tB = new THREE.Vector3(1, -1, -1).multiplyScalar(tetraSize);
			const tC = new THREE.Vector3(-1, 1, -1).multiplyScalar(tetraSize);
			const tD = new THREE.Vector3(-1, -1, 1).multiplyScalar(tetraSize);

			const tetraFaces = [
				[tB, tC, tD], // opposite tA
				[tA, tC, tD], // opposite tB
				[tA, tB, tD], // opposite tC
				[tA, tB, tC]  // opposite tD
			];

			const pointsPerFace = Math.ceil(objects.length / tetraFaces.length);

			// find the smallest row count whose triangular number can hold pointsPerFace
			let tetraRows = 1;
			while ((tetraRows * (tetraRows + 1)) / 2 < pointsPerFace) tetraRows++;

			let tetraObjIndex = 0;

			for (let f = 0; f < tetraFaces.length; f++) {

				const [A, B, C] = tetraFaces[f];

				const normal = new THREE.Vector3()
					.crossVectors(
						new THREE.Vector3().subVectors(B, A),
						new THREE.Vector3().subVectors(C, A)
					)
					.normalize();

				const faceCenter = new THREE.Vector3().addVectors(A, B).add(C).divideScalar(3);
				if (normal.dot(faceCenter) < 0) normal.negate();

				let facePointCount = 0;
				const remaining = Math.min(pointsPerFace, objects.length - tetraObjIndex);

				for (let row = 0; row < tetraRows && facePointCount < remaining; row++) {

					const fullRowCount = row + 1;
					const rowsLeft = tetraRows - row;
					const pointsLeftToPlace = remaining - facePointCount;

					// how many tiles this row should actually get, capped by what's left overall
					const thisRowCount = Math.min(fullRowCount, pointsLeftToPlace, Math.ceil(pointsLeftToPlace / rowsLeft) + fullRowCount - Math.ceil(pointsLeftToPlace / rowsLeft));
					const count = Math.min(fullRowCount, pointsLeftToPlace);

					// center the tiles in this row instead of packing them to one side
					const startOffset = (fullRowCount - count) / 2;

					const t = row / (tetraRows - 1);
					const left = new THREE.Vector3().lerpVectors(A, B, t);
					const right = new THREE.Vector3().lerpVectors(A, C, t);

					for (let col = 0; col < count; col++) {

						if (tetraObjIndex >= objects.length) break;

						const colPos = startOffset + col;
						const s = row === 0 ? 0 : colPos / row;
						const point = new THREE.Vector3().lerpVectors(left, right, Math.min(s, 1));

						const object = new THREE.Object3D();
						object.position.copy(point);

						const lookTarget = new THREE.Vector3().addVectors(point, normal);
						object.lookAt(lookTarget);

						targets.tetrahedron.push(object);

						facePointCount++;
						tetraObjIndex++;

					}

				}

			}
			renderer = new CSS3DRenderer();
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.getElementById('container').appendChild(renderer.domElement);

			//

			controls = new TrackballControls(camera, renderer.domElement);
			controls.minDistance = 500;
			controls.maxDistance = 6000;
			controls.addEventListener('change', render);

			const buttonTable = document.getElementById('table');
			buttonTable.addEventListener('click', function () {

				transform(targets.table, 2000);

			});

			const buttonSphere = document.getElementById('sphere');
			buttonSphere.addEventListener('click', function () {

				transform(targets.sphere, 2000);

			});

			const buttonHelix = document.getElementById('helix');
			buttonHelix.addEventListener('click', function () {

				transform(targets.helix, 2000);

			});

			const buttonGrid = document.getElementById('grid');
			buttonGrid.addEventListener('click', function () {

				transform(targets.grid, 2000);

			});

			const buttonTetrahedron = document.getElementById('tetrahedron');
			buttonTetrahedron.addEventListener('click', function () {

				transform(targets.tetrahedron, 2000);

			});

			transform(targets.table, 2000);

			//

			window.addEventListener('resize', onWindowResize);

		}

		function transform(targets, duration) {

			TWEEN.removeAll();

			for (let i = 0; i < objects.length; i++) {

				const object = objects[i];
				const target = targets[i];

				new TWEEN.Tween(object.position)
					.to({ x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration)
					.easing(TWEEN.Easing.Exponential.InOut)
					.start();

				new TWEEN.Tween(object.rotation)
					.to({ x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration)
					.easing(TWEEN.Easing.Exponential.InOut)
					.start();

			}

			new TWEEN.Tween(this)
				.to({}, duration * 2)
				.onUpdate(render)
				.start();

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize(window.innerWidth, window.innerHeight);

			render();

		}

		function animate() {

			requestAnimationFrame(animate);

			TWEEN.update();

			controls.update();

		}

		function render() {

			renderer.render(scene, camera);

		}

	</script>
</body>

</html>
